<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Painel de Alunos - Academia</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f4f7f6; margin: 0; padding: 20px; }
        nav { background: #2c3e50; padding: 15px 25px; border-radius: 8px; color: white; display: flex; justify-content: space-between; align-items: center; }
        nav a { color: white; text-decoration: none; margin: 0 12px; font-weight: bold; }
        nav a:hover { color: #27ae60; }
        .container { max-width: 900px; margin: 30px auto; background: white; padding: 25px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        .card-info { background: #ecf0f1; padding: 15px; border-radius: 6px; margin: 10px 0; }
        ul { list-style: none; padding: 0; }
        li { background: #f9f9f9; margin: 8px 0; padding: 12px; border-radius: 4px; border: 1px solid #ddd; display: flex; justify-content: space-between; }
    </style>
</head>
<body>
    <nav>
        <h2>🏋️ Sistema Academia</h2>
        <div id="menu-nav"></div>
    </nav>

    <div class="container">
        <h2 id="titulo-pagina">👥 Gestão de Alunos</h2>
        <div id="conteudo-area"></div>
    </div>

    <script>
        const API = "http://127.0.0.1:8000";
        const perfil = localStorage.getItem("perfil") || "aluno";
        const usuarioLogado = localStorage.getItem("usuarioLogado") || "aluno1";

        const menuNav = document.getElementById("menu-nav");
        if (perfil === "admin") {
            menuNav.innerHTML = `
                <a href="dashboard.html">Dashboard</a>
                <a href="alunos.html">Alunos (RF01)</a>
                <a href="aulas.html">Aulas</a>
                <a href="login.html" style="color: #e74c3c;">Sair</a>
            `;
            carregarVisaoAdmin();
        } else {
            menuNav.innerHTML = `
                <a href="dashboard.html">Dashboard</a>
                <a href="alunos.html">Meus Dados & Financeiro</a>
                <a href="aulas.html">Aulas & Inscrições</a>
                <a href="login.html" style="color: #e74c3c;">Sair</a>
            `;
            carregarVisaoAluno();
        }

        async function carregarVisaoAdmin() {
            document.getElementById("titulo-pagina").innerText = "Gestão Administrativa de Alunos (RF01)";
            const res = await fetch(`${API}/alunos`);
            const alunos = await res.json();
            
            let html = "<h3>Lista Geral de Alunos e Situação Financeira</h3><ul>";
            alunos.forEach(a => {
                html += `<li>
                    <span><b>${a.nome}</b> (${a.email}) — Plano: <b>${a.plano}</b></span>
                    <span>Status: <b style="color: ${a.status_pagamento === 'Quitado' ? 'green' : 'red'}">${a.status_pagamento}</b> | Venc: ${a.vencimento_plano}</span>
                </li>`;
            });
            html += "</ul>";
            document.getElementById("conteudo-area").innerHTML = html;
        }

        async function carregarVisaoAluno() {
            document.getElementById("titulo-pagina").innerText = "Meus Dados Cadastrais e Situação Financeira (RN02)";
            const res = await fetch(`${API}/alunos/${usuarioLogado}`);
            const a = await res.json();

            if (res.ok) {
                document.getElementById("conteudo-area").innerHTML = `
                    <div class="card-info">
                        <h3>Informações Pessoais</h3>
                        <p><b>Nome:</b> ${a.nome}</p>
                        <p><b>E-mail:</b> ${a.email}</p>
                        <p><b>Usuário de Acesso:</b> ${a.usuario}</p>
                    </div>
                    <div class="card-info" style="background: #e8f8f5;">
                        <h3>Situação do Plano & Pagamento (RN04 / RN05)</h3>
                        <p><b>Plano Contratado:</b> ${a.plano}</p>
                        <p><b>Data de Vencimento:</b> ${a.vencimento_plano}</p>
                        <p><b>Situação Financeira:</b> <span style="color: ${a.status_pagamento === 'Quitado' ? 'green' : 'red'}; font-weight: bold;">${a.status_pagamento}</span></p>
                    </div>
                `;
            } else {
                document.getElementById("conteudo-area").innerHTML = "<p>Erro ao carregar dados do aluno.</p>";
            }
        }
    </script>
</body>
</html>
