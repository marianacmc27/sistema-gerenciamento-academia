<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Gerenciamento de Alunos - Academia</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f4f7f6; margin: 0; padding: 20px; }
        nav { background: #2c3e50; padding: 15px 25px; border-radius: 8px; color: white; display: flex; justify-content: space-between; align-items: center; }
        nav a { color: white; text-decoration: none; margin: 0 12px; font-weight: bold; }
        nav a:hover { color: #27ae60; }
        .container { max-width: 950px; margin: 30px auto; background: white; padding: 25px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        .card-info { background: #ecf0f1; padding: 15px; border-radius: 6px; margin: 10px 0; }
        ul { list-style: none; padding: 0; }
        li { background: #f9f9f9; margin: 10px 0; padding: 15px; border-radius: 6px; border: 1px solid #ddd; display: flex; justify-content: space-between; align-items: center; }
        form { background: #f9f9f9; padding: 15px; border-radius: 6px; margin-bottom: 25px; border: 1px solid #ddd; }
        .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 10px; }
        input, select { padding: 8px; border: 1px solid #ccc; border-radius: 4px; }
        button { background: #27ae60; color: white; border: none; padding: 8px 15px; border-radius: 4px; cursor: pointer; font-weight: bold; }
        button:hover { background: #219653; }
        .btn-editar { background: #2980b9; }
        .btn-editar:hover { background: #1f618d; }
    </style>
</head>
<body>
    <nav>
        <h2>🏋️ Sistema Academia</h2>
        <div id="menu-nav"></div>
    </nav>

    <div class="container">
        <h2 id="titulo-pagina">Gestão de Alunos</h2>
        
        <!-- Formulário de Cadastro -->
        <div id="painel-cadastro" style="display: none;">
            <h3>Cadastrar Novo Aluno</h3>
            <form onsubmit="cadastrarAluno(event)">
                <div class="form-grid">
                    <input type="number" id="aluno-id" placeholder="ID (ex: 4)" required>
                    <input type="text" id="aluno-usuario" placeholder="Login (ex: aluno4)" required>
                    <input type="text" id="aluno-nome" placeholder="Nome Completo" required>
                    <input type="email" id="aluno-email" placeholder="E-mail" required>
                    <input type="text" id="aluno-plano" placeholder="Plano" required>
                    <select id="aluno-status">
                        <option value="Quitado">Quitado</option>
                        <option value="Pendente">Pendente</option>
                    </select>
                </div>
                <button type="submit">Cadastrar Aluno</button>
            </form>
            <h3>Lista de Alunos e Planos Contratados</h3>
        </div>

        <div id="conteudo-area"></div>
    </div>

    <script>
        const API = "http://127.0.0.1:8000";
        const perfil = localStorage.getItem("perfil") || "aluno";
        const usuarioLogado = localStorage.getItem("usuarioLogado") || "aluno1";

        const menuNav = document.getElementById("menu-nav");
        if (perfil === "admin") {
            menuNav.innerHTML = `
                <a href="dashboard.html">Dashboard</a>
                <a href="alunos.html">Alunos & Planos</a>
                <a href="aulas.html">Aulas</a>
                <a href="login.html" style="color: #e74c3c;">Sair</a>
            `;
            document.getElementById("painel-cadastro").style.display = "block";
            carregarVisaoAdmin();
        } else {
            menuNav.innerHTML = `
                <a href="dashboard.html">Dashboard</a>
                <a href="alunos.html">Meus Dados</a>
                <a href="aulas.html">Aulas & Inscrições</a>
                <a href="login.html" style="color: #e74c3c;">Sair</a>
            `;
            carregarVisaoAluno();
        }

        async function carregarVisaoAdmin() {
            document.getElementById("titulo-pagina").innerText = "Gerenciamento de Alunos, Planos e Pagamentos";
            const res = await fetch(`${API}/alunos`);
            const alunos = await res.json();
            
            let html = "<ul>";
            alunos.forEach(a => {
                html += `<li>
                    <div>
                        <b>${a.nome}</b> (${a.email})<br>
                        <small>Plano: <b>${a.plano}</b> | Vencimento: ${a.vencimento_plano} | Status: <span style="color: ${a.status_pagamento === 'Quitado' ? 'green' : 'red'}; font-weight: bold;">${a.status_pagamento}</span></small>
                    </div>
                    <button class="btn-editar" onclick='prepararAtualizacao(${JSON.stringify(a)})'>Atualizar Dados</button>
                </li>`;
            });
            html += "</ul>";
            document.getElementById("conteudo-area").innerHTML = html;
        }

        async function cadastrarAluno(e) {
            e.preventDefault();
            const novo = {
                id: parseInt(document.getElementById("aluno-id").value),
                usuario: document.getElementById("aluno-usuario").value,
                nome: document.getElementById("aluno-nome").value,
                email: document.getElementById("aluno-email").value,
                plano: document.getElementById("aluno-plano").value,
                status_pagamento: document.getElementById("aluno-status").value,
                vencimento_plano: "2026-12-31"
            };

            const res = await fetch(`${API}/alunos`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(novo)
            });

            if (res.ok) {
                alert("Aluno cadastrado com sucesso!");
                carregarVisaoAdmin();
                e.target.reset();
            } else {
                const err = await res.json();
                alert(err.detail);
            }
        }

        function prepararAtualizacao(a) {
            const novoNome = prompt("Atualizar Nome:", a.nome);
            if (novoNome === null) return;
            const novoEmail = prompt("Atualizar E-mail:", a.email);
            const novoPlano = prompt("Atualizar Plano:", a.plano);
            const novoStatus = prompt("Atualizar Situação Financeira (Quitado ou Pendente):", a.status_pagamento);
            const novoVencimento = prompt("Atualizar Vencimento (AAAA-MM-DD):", a.vencimento_plano);

            atualizarAlunoAPI(a.id, {
                nome: novoNome,
                email: novoEmail,
                plano: novoPlano,
                status_pagamento: novoStatus,
                vencimento_plano: novoVencimento
            });
        }

        async function atualizarAlunoAPI(id, dados) {
            const res = await fetch(`${API}/alunos/${id}`, {
                method: "PUT",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(dados)
            });
            if (res.ok) {
                alert("Dados do aluno atualizados com sucesso!");
                carregarVisaoAdmin();
            } else {
                alert("Erro ao atualizar aluno.");
            }
        }

        async function carregarVisaoAluno() {
            document.getElementById("titulo-pagina").innerText = "Meus Dados Cadastrais e Situação Financeira";
            const res = await fetch(`${API}/alunos/${usuarioLogado}`);
            const a = await res.json();

            if (res.ok) {
                document.getElementById("conteudo-area").innerHTML = `
                    <div class="card-info">
                        <h3>Informações Pessoais</h3>
                        <p><b>Nome:</b> ${a.nome}</p>
                        <p><b>E-mail:</b> ${a.email}</p>
                        <p><b>Usuário de Acesso:</b> ${a.usuario}</p>
                    </div>
                    <div class="card-info" style="background: #e8f8f5;">
                        <h3>Situação do Plano & Pagamento</h3>
                        <p><b>Plano Contratado:</b> ${a.plano}</p>
                        <p><b>Data de Vencimento:</b> ${a.vencimento_plano}</p>
                        <p><b>Situação Financeira:</b> <span style="color: ${a.status_pagamento === 'Quitado' ? 'green' : 'red'}; font-weight: bold;">${a.status_pagamento}</span></p>
                    </div>
                `;
            } else {
                document.getElementById("conteudo-area").innerHTML = "<p>Erro ao carregar dados do aluno.</p>";
            }
        }
    </script>
</body>
</html>
