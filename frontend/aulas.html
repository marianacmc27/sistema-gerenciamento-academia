<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Aulas - Academia</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f4f7f6; margin: 0; padding: 20px; }
        nav { background: #2c3e50; padding: 15px; border-radius: 8px; color: white; display: flex; justify-content: space-between; align-items: center; }
        nav a { color: white; text-decoration: none; margin: 0 15px; font-weight: bold; }
        nav a:hover { color: #27ae60; }
        .container { max-width: 900px; margin: 30px auto; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        ul { list-style: none; padding: 0; }
        li { background: #ecf0f1; margin: 8px 0; padding: 12px; border-radius: 4px; display: flex; justify-content: space-between; align-items: center; }
        button { background: #27ae60; color: white; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; }
        button:hover { background: #219653; }
        .lotado { background: #e74c3c; cursor: not-allowed; }
    </style>
</head>
<body>
    <nav>
        <h2>🏋️ Sistema Academia</h2>
        <div>
            <a href="dashboard.html">Dashboard</a>
            <a href="alunos.html">Alunos</a>
            <a href="aulas.html">Aulas</a>
            <a href="login.html" style="color: #e74c3c;">Sair</a>
        </div>
    </nav>

    <div class="container">
        <h2>🏃‍♂️ Gestão de Aulas e Limite de Vagas</h2>
        <ul id="lista-aulas"></ul>
    </div>

    <script>
        const API = "http://127.0.0.1:8000";

        async function carregarAulas() {
            const res = await fetch(`${API}/aulas`);
            const aulas = await res.json();
            const ul = document.getElementById("lista-aulas");
            ul.innerHTML = "";
            aulas.forEach(a => {
                const vagasRestantes = a.vagas_maximas - a.inscritos;
                const lotado = vagasRestantes <= 0;
                ul.innerHTML += `
                    <li>
                        <span><b>${a.nome}</b> — Vagas: ${a.inscritos}/${a.vagas_maximas} (${vagasRestantes} livres)</span>
                        <button class="${lotado ? 'lotado' : ''}" ${lotado ? 'disabled' : ''} onclick="inscrever(${a.id})">
                            ${lotado ? 'Lotado' : 'Inscrever-se'}
                        </button>
                    </li>`;
            });
        }

        async function inscrever(id) {
            const res = await fetch(`${API}/aulas/${id}/inscrever`, { method: "POST" });
            const data = await res.json();
            if (res.ok) {
                alert(data.message);
                carregarAulas();
            } else {
                alert(data.detail);
            }
        }

        carregarAulas();
    </script>
</body>
</html>
