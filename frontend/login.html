<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Login - Academia</title>
    <style>
        body { font-family: Arial, sans-serif; background: #2c3e50; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .login-card { background: white; padding: 30px; border-radius: 8px; width: 300px; box-shadow: 0 4px 10px rgba(0,0,0,0.3); }
        h2 { text-align: center; color: #2c3e50; }
        input { width: 100%; padding: 10px; margin: 10px 0; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        button { width: 100%; background: #27ae60; color: white; border: none; padding: 10px; border-radius: 4px; cursor: pointer; font-size: 16px; }
        button:hover { background: #219653; }
        .erro { color: red; font-size: 14px; text-align: center; }
    </style>
</head>
<body>
    <div class="login-card">
        <h2>🏋️ Entrar</h2>
        <input type="text" id="usuario" placeholder="Usuário (admin)" value="admin">
        <input type="password" id="senha" placeholder="Senha (1234)" value="1234">
        <button onclick="logar()">Acessar Sistema</button>
        <p id="msg-erro" class="erro"></p>
    </div>

    <script>
        async function logar() {
            const usuario = document.getElementById("usuario").value;
            const senha = document.getElementById("senha").value;
            try {
                const res = await fetch("http://127.0.0.1:8000/login", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ usuario, senha })
                });
                if (res.ok) {
                    window.location.href = "dashboard.html";
                } else {
                    document.getElementById("msg-erro").innerText = "Credenciais inválidas!";
                }
            } catch (err) {
                document.getElementById("msg-erro").innerText = "Erro ao conectar com o servidor.";
            }
        }
    </script>
</body>
</html>
