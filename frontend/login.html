<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Login - Sistema de Academia</title>
    <style>
        :root {
            --primary: #1e293b;
            --primary-hover: #0f172a;
            --accent: #2563eb;
            --accent-hover: #1d4ed8;
            --danger: #dc2626;
            --bg-main: #f8fafc;
            --bg-card: #ffffff;
            --text-main: #334155;
            --text-muted: #64748b;
            --border-color: #e2e8f0;
        }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background-color: var(--primary);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            -webkit-font-smoothing: antialiased;
        }

        .login-card {
            background-color: var(--bg-card);
            padding: 40px;
            border-radius: 12px;
            width: 360px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.2), 0 8px 10px -6px rgba(0, 0, 0, 0.2);
            border: 1px solid var(--border-color);
            box-sizing: border-box;
        }

        h2 {
            text-align: center;
            color: var(--primary);
            margin-top: 0;
            margin-bottom: 24px;
            font-size: 1.5rem;
            font-weight: 600;
        }

        input {
            width: 100%;
            padding: 12px 14px;
            margin: 8px 0 16px 0;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 0.95rem;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        input:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
        }

        button {
            width: 100%;
            background-color: var(--accent);
            color: white;
            border: none;
            padding: 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 1rem;
            font-weight: 600;
            transition: background-color 0.2s, transform 0.1s;
            margin-top: 8px;
        }

        button:hover {
            background-color: var(--accent-hover);
        }

        button:active {
            transform: scale(0.98);
        }

        .erro {
            color: var(--danger);
            font-size: 0.85rem;
            text-align: center;
            margin-top: 12px;
            font-weight: 500;
        }

        .hint {
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-top: 24px;
            text-align: center;
            line-height: 1.5;
            background-color: var(--bg-main);
            padding: 12px;
            border-radius: 6px;
            border: 1px solid var(--border-color);
        }

        .hint code {
            background-color: #e2e8f0;
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 0.8rem;
            color: var(--primary);
        }
    </style>
</head>
<body>
    <div class="login-card">
        <h2>🏋️ Academia ECOT11A</h2>
        <input type="text" id="usuario" placeholder="Usuário (admin ou aluno1)" value="aluno1">
        <input type="password" id="senha" placeholder="Senha (1234)" value="1234">
        <button onclick="logar()">Entrar</button>
        <p id="msg-erro" class="erro"></p>
        <div class="hint">
            <b>Perfis de Teste:</b><br>
            Admin: <code>admin</code> / <code>1234</code><br>
            Aluno: <code>aluno1</code> / <code>1234</code>
        </div>
    </div>

    <script>
        async function logar() {
            const usuario = document.getElementById("usuario").value;
            const senha = document.getElementById("senha").value;
            try {
                const res = await fetch("http://127.0.0.1:8000/login", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ usuario, senha })
                });
                const data = await res.json();
                if (res.ok) {
                    localStorage.setItem("perfil", data.perfil);
                    localStorage.setItem("nomeUsuario", data.nome);
                    localStorage.setItem("usuarioLogado", data.usuario);
                    window.location.href = "dashboard.html";
                } else {
                    document.getElementById("msg-erro").innerText = data.detail;
                }
            } catch (err) {
                document.getElementById("msg-erro").innerText = "Erro de conexão com o servidor.";
            }
        }
    </script>
</body>
</html>
