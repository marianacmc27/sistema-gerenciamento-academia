<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Dashboard - Academia</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f4f7f6; margin: 0; padding: 20px; }
        nav { background: #2c3e50; padding: 15px; border-radius: 8px; color: white; display: flex; justify-content: space-between; align-items: center; }
        nav a { color: white; text-decoration: none; margin: 0 15px; font-weight: bold; }
        nav a:hover { color: #27ae60; }
        .container { max-width: 900px; margin: 30px auto; display: flex; gap: 20px; }
        .card { background: white; flex: 1; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); text-align: center; }
        .card h3 { color: #2c3e50; margin-bottom: 5px; }
        .card p { font-size: 24px; font-weight: bold; color: #27ae60; }
    </style>
</head>
<body>
    <nav>
        <h2>🏋️ Sistema Academia</h2>
        <div>
            <a href="dashboard.html">Dashboard</a>
            <a href="alunos.html">Alunos</a>
            <a href="aulas.html">Aulas</a>
            <a href="login.html" style="color: #e74c3c;">Sair</a>
        </div>
    </nav>

    <div class="container">
        <div class="card">
            <h3>Total de Alunos</h3>
            <p id="num-alunos">-</p>
        </div>
        <div class="card">
            <h3>Aulas Ativas</h3>
            <p id="num-aulas">-</p>
        </div>
        <div class="card">
            <h3>Ocupação Geral</h3>
            <p id="ocupacao">-</p>
        </div>
    </div>

    <script>
        async function carregarDashboard() {
            try {
                const res = await fetch("http://127.0.0.1:8000/estatisticas");
                const data = await res.json();
                document.getElementById("num-alunos").innerText = data.total_alunos;
                document.getElementById("num-aulas").innerText = data.total_aulas;
                document.getElementById("ocupacao").innerText = `${data.vagas_ocupadas} / ${data.vagas_totais}`;
            } catch (err) {
                console.error("Erro ao carregar estatísticas.");
            }
        }
        carregarDashboard();
    </script>
</body>
</html>
