<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Dashboard - Academia</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f4f7f6; margin: 0; padding: 20px; }
        nav { background: #2c3e50; padding: 15px 25px; border-radius: 8px; color: white; display: flex; justify-content: space-between; align-items: center; }
        nav .menu a { color: white; text-decoration: none; margin: 0 12px; font-weight: bold; }
        nav .menu a:hover { color: #27ae60; }
        .container { max-width: 900px; margin: 30px auto; }
        .welcome { background: white; padding: 20px; border-radius: 8px; margin-bottom: 20px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        .cards-grid { display: flex; gap: 20px; }
        .card { background: white; flex: 1; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); text-align: center; }
        .card h3 { color: #2c3e50; margin-bottom: 5px; }
        .card p { font-size: 26px; font-weight: bold; color: #27ae60; margin: 0; }
    </style>
</head>
<body>
    <nav>
        <h2>🏋️ Sistema Academia</h2>
        <div class="menu" id="menu-nav"></div>
    </nav>

    <div class="container">
        <div class="welcome">
            <h2 id="titulo-boas-vindas" style="margin-top:0; color:#2c3e50;">Carregando...</h2>
            <p id="sub-boas-vindas" style="color:#666; margin-bottom:0;"></p>
        </div>

        <div class="cards-grid">
            <div class="card">
                <h3>Total de Alunos</h3>
                <p id="num-alunos">-</p>
            </div>
            <div class="card">
                <h3>Turmas Ativas</h3>
                <p id="num-aulas">-</p>
            </div>
            <div class="card">
                <h3>Ocupação Geral</h3>
                <p id="ocupacao">-</p>
            </div>
        </div>
    </div>

    <script>
        const perfil = localStorage.getItem("perfil") || "aluno";
        const nome = localStorage.getItem("nomeUsuario") || "Usuário";

        // Configurar Menu dinâmico baseado no perfil (Requisito de Permissões)
        const menuNav = document.getElementById("menu-nav");
        if (perfil === "admin") {
            menuNav.innerHTML = `
                <a href="dashboard.html">Dashboard</a>
                <a href="alunos.html">Alunos</a>
                <a href="aulas.html">Aulas</a>
                <a href="login.html" style="color: #e74c3c;">Sair</a>
            `;
            document.getElementById("titulo-boas-vindas").innerText = `Bem-vindo, ${nome} (Administrador)`;
            document.getElementById("sub-boas-vindas").innerText = "Você possui acesso completo à gestão de cadastros, planos e controle de capacidade das turmas.";
        } else {
            menuNav.innerHTML = `
                <a href="dashboard.html">Dashboard</a>
                <a href="aulas.html">Ver Aulas & Inscrever-se</a>
                <a href="login.html" style="color: #e74c3c;">Sair</a>
            `;
            document.getElementById("titulo-boas-vindas").innerText = `Olá, ${nome} (Aluno)`;
            document.getElementById("sub-boas-vindas").innerText = "Consulte os horários disponíveis e faça sua inscrição nas aulas com controle de vagas em tempo real.";
        }

        async function carregarDashboard() {
            try {
                const res = await fetch("http://127.0.0.1:8000/estatisticas");
                const data = await res.json();
                document.getElementById("num-alunos").innerText = data.total_alunos;
                document.getElementById("num-aulas").innerText = data.total_aulas;
                document.getElementById("ocupacao").innerText = `${data.vagas_ocupadas} / ${data.vagas_totais}`;
            } catch (err) {
                console.error("Erro ao carregar estatísticas.");
            }
        }
        carregarDashboard();
    </script>
</body>
</html>
